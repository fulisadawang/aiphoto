name: AIPhoto
options:
  bundleIdPrefix: com.nieyutan
  deploymentTarget:
    macOS: "15.0"
  developmentLanguage: zh-Hans
packages:
  # 自动更新，发版流程见 scripts/release.sh
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.10.0
targets:
  AIPhoto:
    type: application
    platform: macOS
    sources:
      - AIPhoto
    dependencies:
      - package: Sparkle
    info:
      path: AIPhoto/Info.plist
      properties:
        # 基础名要和安装包文件名 AIPhoto.app 一致，系统才会用本地化的显示名；
        # 访达、Dock、菜单栏显示的「小宇专属」来自 *.lproj/InfoPlist.strings
        CFBundleName: AIPhoto
        CFBundleDisplayName: AIPhoto
        LSHasLocalizedDisplayName: true
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.photography
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        NSPrincipalClass: NSApplication
        # 「关于」窗口里注明借用的开源代码（MIT 许可证要求保留出处）
        NSHumanReadableCopyright: "祛瑕疵和本机去杂物使用了 Compositor（github.com/robbietilton/Compositor，MIT 许可证）的修复画笔与内容识别填充代码。"
        # Sparkle 自动更新：清单在仓库 main 分支，安装包在 GitHub Releases，发版见 scripts/release.sh
        SUFeedURL: https://raw.githubusercontent.com/fulisadawang/aiphoto/main/appcast.xml
        SUPublicEDKey: UuKKT4SrkszM4j9yt/T6YaTUIvqodGB3aPwtxTty928=
        # 自用，不再在第二次启动时询问是否自动检查
        SUEnableAutomaticChecks: true
        # 允许访问任意 http 地址（本机 Magpie、局域网或其他机器上的服务、域名都可以，用户 2026-10-20 要求）。
        # 不能同时写 NSAllowsLocalNetworking：有它时系统会忽略 NSAllowsArbitraryLoads
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        # 允许把文件夹拖到 Dock 图标上打开
        CFBundleDocumentTypes:
          - CFBundleTypeName: 照片文件夹
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.folder]
    settings:
      base:
        # 显示名见 CFBundleDisplayName；产品名和 bundle id 不改，改了会断掉 Sparkle 更新和已有设置
        PRODUCT_NAME: AIPhoto
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.nieyutan.aiphoto
        SWIFT_VERSION: "5.0"
        # Compositor 的修复画笔和内容识别填充是 C 代码（Vendor/Compositor），经桥接头给 Swift 调用
        SWIFT_OBJC_BRIDGING_HEADER: AIPhoto/AIPhoto-Bridging-Header.h
        MARKETING_VERSION: "0.9.2"
        CURRENT_PROJECT_VERSION: "16"
        GENERATE_INFOPLIST_FILE: NO
        # 仅自用：本机临时签名，不开沙盒，便于直接读写照片文件夹
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
        DEVELOPMENT_TEAM: ""
